name: RPG Runtime Quality

on:
  pull_request:
    branches: ["retrom/gc8dbfd492afd"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpg-runtime-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Validate fixed fork source contract
        run: python3 .github/rpg-runtime/verify-source.py
      - name: Install test dependencies
        run: npm ci
      - name: Run bridge unit tests
        run: |
          npm run test:retrom-runtime
          python3 -m unittest tests.test_retrom_release
      - name: Install Chrome for Testing
        run: npx playwright install --with-deps chromium
      - name: Run the upstream sample lifecycle test
        run: npm run test:retrom-runtime-browser
      - name: Build the bridge-only integration candidate
        run: |
          python3 .github/rpg-runtime/build-release.py \
            --output "$RUNNER_TEMP/rpg-runtime-output" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag retrom-core-gc8dbfd492afd-r1-rc.1 \
            --commit "$GITHUB_SHA"
