name: RPG Runtime Quality

on:
  pull_request:
    branches: ["retrom/gc8dbfd492afd"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpg-runtime-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate fixed fork source contract
        run: python3 .github/rpg-runtime/verify-source.py
